# Staging environment values
global:
  imageRegistry: "ghcr.io"

backend:
  replicaCount: 2
  
  image:
    tag: "main"
    pullPolicy: Always
    
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
      
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
      
  env:
    SECRET_KEY: "staging-secret-key-change-me"
    DATABASE_URL: "sqlite:///./data/ebrose-staging.db"
    
  corsOrigins:
    - "https://staging.ebrose.com"
    - "https://api-staging.ebrose.com"
    - "https://ebrose.kwatog.com"
    - "https://ebrose-api.kwatog.com"

  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-staging"
    hosts:
      - host: api-staging.ebrose.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: ebrose-api-staging-tls
        hosts:
          - api-staging.ebrose.com

frontend:
  replicaCount: 2
  
  image:
    tag: "main"
    pullPolicy: Always
    
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
      
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
      
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-staging"
    hosts:
      - host: staging.ebrose.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: ebrose-frontend-staging-tls
        hosts:
          - staging.ebrose.com
