# Default values for ebrose
# This is a YAML-formatted file.
# For single-replica K8s deployment, use: helm install ebrose ./helm/ebrose -f ./helm/ebrose/values.yaml

global:
  imageRegistry: ""
  imagePullSecrets: []
  
nameOverride: ""
fullnameOverride: ""

# Backend configuration
backend:
  enabled: true
  replicaCount: 1  # Single replica for K8s (SQLite requires single instance)
  
  image:
    registry: docker.io
    repository: ebrose/backend
    tag: "latest"
    pullPolicy: IfNotPresent
    
  serviceAccount:
    create: true
    annotations: {}
    name: ""
    
  podAnnotations: {}
  podSecurityContext:
    fsGroup: 1001
    
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1001
    capabilities:
      drop:
      - ALL
      
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
    annotations: {}
    
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: api.ebrose.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
    
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
      
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    
  nodeSelector: {}
  tolerations: []
  affinity: {}
  
  # Environment variables (use K8s secrets for sensitive values)
  env:
    DATABASE_URL: "sqlite:///./data/ebrose.db"
    SECRET_KEY: "change-this-secret-key-for-production"
    ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
    LOG_LEVEL: "INFO"
    ENVIRONMENT: "production"
    DEBUG: "false"
    DOCS_ENABLED: "false"
    RUN_MIGRATIONS_ON_STARTUP: "true"
    AUTO_CREATE_TABLES: "false"
    
  # Required secrets (set via K8s secrets, not in values.yaml)
  # - ADMIN_PASSWORD: Admin user password
  # - ADMIN_USERNAME: Admin username (default: admin)
  # - ADMIN_EMAIL: Admin email (default: admin@ebrose.local)
  # - ADMIN_FULL_NAME: Admin full name (default: System Administrator)
  secrets:
    enabled: false
    # secretName: ebrose-secrets
    
  # CORS allowed origins (list format)
  corsOrigins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "https://ebrose.kwatog.com"
    - "https://ebrose-api.kwatog.com"

    
  # Health checks
  healthCheck:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    
  # Persistence for database
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi

# Frontend configuration  
frontend:
  enabled: true
  replicaCount: 1  # Single replica for K8s
  
  image:
    registry: docker.io
    repository: ebrose/frontend
    tag: "latest"
    pullPolicy: IfNotPresent
    
  serviceAccount:
    create: true
    annotations: {}
    name: ""
    
  podAnnotations: {}
  podSecurityContext:
    fsGroup: 1001
    
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1001
    capabilities:
      drop:
      - ALL
      
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
    annotations: {}
    
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: ebrose.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
    
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
      
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    
  nodeSelector: {}
  tolerations: []
  affinity: {}
  
  # Environment variables
  env:
    NUXT_PUBLIC_API_BASE: "http://backend:8000"
    
  # Health checks
  healthCheck:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3