apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebrose-backend-data-pv
  labels:
    app.kubernetes.io/name: ebrose
    app.kubernetes.io/component: backend
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  hostPath:
    path: /data/ebrose/backend
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker-04
